# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME

font_size 18

# BEGIN_KITTY_FONTS
font_family     Monaco
bold_font        auto
italic_font      auto
bold_italic_font auto

# END_KITTY_FONTS

# tab bar
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style round

# windows
# remember_window_size yes

copy_on_select yes

# cursor_shape block
cursor_shape_unfocused hollow
cursor_trail 1

macos_option_as_alt yes
background_opacity 0.8
background_blur 80